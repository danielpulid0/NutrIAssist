<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NutrIAssist - Crear Cuenta</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/global.css?v=3">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="manifest" href="/nutriassist/manifest.json">
    <meta name="theme-color" content="#15B85E">
    <link rel="apple-touch-icon" href="/nutriassist/assets/img/icon-192.png">
    <script src="../assets/js/theme.js"></script>
    <style>
        .password-requirements {
            margin-top: -10px;
            margin-bottom: 20px;
            padding-left: 5px;
            font-size: 0.85rem;
            color: #94A3B8;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .requirement {
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s ease;
        }

        .requirement svg {
            width: 14px;
            height: 14px;
            color: #CBD5E1;
            transition: color 0.3s ease;
        }

        .requirement.valid {
            color: #15B85E;
        }

        .requirement.valid svg {
            color: #15B85E;
        }
    </style>
</head>

<body>

    <div class="mobile-container mobile-container-register">
        <!-- Barra de navegación con botón atrás -->
        <div class="nav-bar">
            <a href="login.html" class="back-btn" aria-label="Volver"><svg width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12" />
                    <polyline points="12 19 5 12 12 5" />
                </svg></a>
        </div>

        <div class="page-header">
            <h1>Crear Cuenta</h1>
            <p>Únete a nuestra comunidad de salud y bienestar.</p>
        </div>

        <form action="../controllers/procesar_registro.php" method="POST" class="flex-form-container">

            <label class="form-label" for="nombre">Nombre completo</label>
            <input class="form-input" type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre completo"
                autocomplete="name" pattern="[a-zA-ZáéíóúüñÁÉÍÓÚÜÑ\s]+"
                title="El nombre completo solo debe contener letras."
                onkeypress="return /^[a-zA-ZáéíóúüñÁÉÍÓÚÜÑ\s]$/.test(event.key)"
                oninput="this.value = this.value.replace(/[^a-zA-ZáéíóúüñÁÉÍÓÚÜÑ\s]/g, '')">

            <label class="form-label" for="email">Correo electrónico</label>
            <input class="form-input" type="email" id="email" name="email" placeholder="ejemplo@correo.com"
                autocomplete="email"
                oninvalid="if(this.validity.valueMissing || this.validity.typeMismatch) this.setCustomValidity('Por favor, ingresa un correo electrónico válido')"
                oninput="this.setCustomValidity('')">

            <label class="form-label" for="password">Contraseña</label>
            <div class="input-wrapper">
                <input class="form-input" type="password" id="password" name="password"
                    placeholder="Crea una contraseña segura" minlength="8" autocomplete="new-password"
                    pattern="(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}"
                    title="La contraseña debe tener al menos 8 caracteres, incluir una letra, un número y un carácter especial.">
                <button type="button" class="input-icon-right" id="toggle-pw" aria-label="Mostrar contraseña">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>

            <div id="password-requirements" class="password-requirements">
                <span id="req-length" class="requirement">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    Al menos 8 caracteres
                </span>
                <span id="req-letter" class="requirement">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    Al menos una letra
                </span>
                <span id="req-number" class="requirement">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    Al menos un número
                </span>
                <span id="req-special" class="requirement">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    Un carácter especial (!@#$...)
                </span>
            </div>

            <label class="form-label" for="confirm_password">Confirmar contraseña</label>
            <div class="input-wrapper">
                <input class="form-input" type="password" id="confirm_password" name="confirm_password"
                    placeholder="Repite tu contraseña" minlength="8" autocomplete="new-password">
                <button type="button" class="input-icon-right" id="toggle-confirm-pw" aria-label="Mostrar contraseña">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>
            <div id="match-error"
                style="color: #ef4444; font-size: 0.8rem; margin-top: -0.8rem; margin-bottom: 1rem; display: none;">
                Las contraseñas no coinciden.
            </div>

            <div class="sticky-footer">
                <button type="submit" id="btn-submit" class="btn-primary">Registrarse</button>
                <div class="terms-text">
                    Al registrarte, aceptas nuestros
                    <a href="terminos.php">Términos y Condiciones</a>
                </div>
            </div>
        </form>

        <div class="bottom-link registro">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </div>
    </div>

    <script>
        function setupToggle(buttonId, inputId) {
            const btn = document.getElementById(buttonId);
            const input = document.getElementById(inputId);
            btn.addEventListener('click', () => {
                const isHidden = input.type === 'password';
                input.type = isHidden ? 'text' : 'password';
                btn.innerHTML = isHidden
                    ? `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
                    : `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
            });
        }
        setupToggle('toggle-pw', 'password');
        setupToggle('toggle-confirm-pw', 'confirm_password');

        // Lógica de validación en tiempo real
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirm_password');
        const matchError = document.getElementById('match-error');
        const submitBtn = document.getElementById('btn-submit');

        const reqLength = document.getElementById('req-length');
        const reqLetter = document.getElementById('req-letter');
        const reqNumber = document.getElementById('req-number');
        const reqSpecial = document.getElementById('req-special');

        const nombreInput = document.getElementById('nombre');
        const emailInput = document.getElementById('email');

        function validateForm() {
            let isValid = true;

            // 1. Verificar que los campos no estén vacíos
            if (nombreInput.value.trim() === '' || 
                emailInput.value.trim() === '' || 
                passwordInput.value === '' || 
                confirmInput.value === '') {
                isValid = false;
            }

            // 2. Verificar que las contraseñas coincidan (mostrar error visual solo si ya escribió algo en confirmar)
            if (confirmInput.value.length > 0) {
                if (passwordInput.value !== confirmInput.value) {
                    matchError.style.display = 'block';
                    isValid = false;
                } else {
                    matchError.style.display = 'none';
                }
            } else {
                matchError.style.display = 'none';
            }

            // 3. Habilitar o deshabilitar botón
            if (isValid) {
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
            } else {
                submitBtn.disabled = true;
                submitBtn.style.opacity = '0.5';
            }
        }

        nombreInput.addEventListener('input', validateForm);
        emailInput.addEventListener('input', validateForm);
        confirmInput.addEventListener('input', validateForm);
        passwordInput.addEventListener('input', validateForm);

        // Ejecutar al inicio por si el navegador autocompleta
        validateForm();

        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;

            // Longitud >= 8
            if (val.length >= 8) reqLength.classList.add('valid');
            else reqLength.classList.remove('valid');

            // Letra
            if (/[a-zA-Z]/.test(val)) reqLetter.classList.add('valid');
            else reqLetter.classList.remove('valid');

            // Número
            if (/\d/.test(val)) reqNumber.classList.add('valid');
            else reqNumber.classList.remove('valid');

            // Carácter Especial
            if (/[^A-Za-z0-9]/.test(val)) reqSpecial.classList.add('valid');
            else reqSpecial.classList.remove('valid');

            validateForm();
        });

        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');

        // Rellenar campos si vienen en la URL tras redirigir por error
        const nombreVal = urlParams.get('nombre');
        const emailVal = urlParams.get('email');
        if (nombreVal) {
            document.getElementById('nombre').value = decodeURIComponent(nombreVal);
        }
        if (emailVal) {
            document.getElementById('email').value = decodeURIComponent(emailVal);
        }

        // Limpiar custom validity nativo al escribir
        document.getElementById('password').addEventListener('input', function() { this.setCustomValidity(''); });
        document.getElementById('confirm_password').addEventListener('input', function() { this.setCustomValidity(''); });

        // Activar validación nativa (burbujas sobre los inputs) basada en el error del backend
        if (error) {
            if (error === 'email_existente') {
                const emailInput = document.getElementById('email');
                emailInput.setCustomValidity('El correo ingresado ya está asociado a una cuenta');
                emailInput.reportValidity();
            } else if (error === 'password_insegura') {
                const pwInput = document.getElementById('password');
                pwInput.setCustomValidity('La contraseña debe tener al menos 8 caracteres, incluir una letra, un número y un carácter especial.');
                pwInput.reportValidity();
            } else if (error === 'no_coinciden') {
                const cpwInput = document.getElementById('confirm_password');
                cpwInput.setCustomValidity('Las contraseñas no coinciden. Por favor, verifica.');
                cpwInput.reportValidity();
            } else if (error === 'formato_invalido') {
                const emailInput = document.getElementById('email');
                emailInput.setCustomValidity('El formato del correo electrónico no es válido.');
                emailInput.reportValidity();
            }
        }
    </script>

    <!-- Registro de Service Worker para PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/nutriassist/sw.js')
                    .catch(err => console.log('Error SW:', err));
            });
        }
    </script>
</body>

</html>
