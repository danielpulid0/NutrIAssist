<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NutrIAssist - Registro</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../assets/css/global.css">
    
    <style>
        .header { text-align: center; margin: 2.5rem 0; }
        .login-link { text-align: center; margin-top: auto; padding-top: 2rem; font-size: 0.95rem; }
        .login-link a { color: var(--color-malachite); font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>

    <div class="mobile-container">
        <div class="header">
            <h1>Crear Cuenta</h1>
            <p>Comienza tu viaje nutricional inteligente.</p>
        </div>

        <form action="../controllers/procesar_registro.php" method="POST">
            <label class="form-label" for="nombre">Nombre completo</label>
            <input class="form-input" type="text" id="nombre" name="nombre" placeholder="Ej. Daniel Pulido" required>

            <label class="form-label" for="email">Correo electrónico</label>
            <input class="form-input" type="email" id="email" name="email" placeholder="tu@correo.com" required>

            <label class="form-label" for="password">Contraseña</label>
            <input class="form-input" type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required minlength="8">

            <button type="submit" class="btn-primary">Registrarse</button>
        </form>

        <div class="login-link">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
        </div>
    </div>

</body>
</html>
