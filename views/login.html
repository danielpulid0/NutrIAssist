<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NutrIAssist - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/global.css?v=3">
    <link rel="stylesheet" href="../assets/css/auth.css">

    <!-- PWA Config -->
    <link rel="manifest" href="/nutriassist/manifest.json">
    <meta name="theme-color" content="#15B85E">
    <link rel="apple-touch-icon" href="/nutriassist/assets/img/icon-192.png">
</head>

<body>

    <div class="mobile-container">

        <!-- Logo + marca -->
        <div class="brand-logo">
            <div class="icon-circle">
                <img src="../assets/img/icon-192.png" alt="NutrIAssist logo">
            </div>
            <div class="brand-name">NutrIAssist</div>
            <div class="brand-tagline">Tu camino hacia una vida saludable</div>
        </div>

        <div class="section-title">Iniciar Sesión</div>

        <div class="alert-error" id="error-box">
            Correo o contraseña incorrectos.
        </div>

        <form action="../controllers/procesar_login.php" method="POST" class="flex-form-container">

            <label class="form-label" for="email">Correo electrónico</label>
            <input class="form-input" type="email" id="email" name="email" placeholder="ejemplo@correo.com" required
                autocomplete="email">

            <label class="form-label" for="password">Contraseña</label>
            <div class="input-wrapper">
                <input class="form-input" type="password" id="password" name="password" placeholder="·········" required
                    autocomplete="current-password">
                <button type="button" class="input-icon-right" id="toggle-pw" aria-label="Mostrar contraseña">
                    <!-- Eye icon -->
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>
            </div>

            <div class="forgot-password">
                <a href="#">Olvidé mi contraseña</a>
            </div>

            <div class="sticky-footer">
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
                <div class="bottom-link">
                    ¿No tienes cuenta? <a href="registro.html">Regístrate</a><br>
                    <a href="terminos.php" class="terms-link-login">Términos y Condiciones</a>
                </div>
            </div>
        </form>
    </div>

    <script>
        // Mostrar error si viene del servidor
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const errorBox = document.getElementById('error-box');

        if (error === 'credenciales_invalidas') {
            errorBox.innerText = 'Correo o contraseña incorrectos.';
            errorBox.style.display = 'block';
        } else if (error === 'campos_invalidos') {
            errorBox.innerText = 'Por favor, ingresa un correo válido y tu contraseña.';
            errorBox.style.display = 'block';
        }

        // Toggle mostrar/ocultar contraseña
        const togglePw = document.getElementById('toggle-pw');
        const pwInput = document.getElementById('password');
        togglePw.addEventListener('click', () => {
            const isHidden = pwInput.type === 'password';
            pwInput.type = isHidden ? 'text' : 'password';
            // Cambiar ícono
            togglePw.innerHTML = isHidden
                ? `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
                : `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
        });
    </script>

    <!-- Registro de Service Worker para PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/nutriassist/sw.js')
                    .catch(err => console.log('Error SW:', err));
            });
        }
    </script>
</body>

</html>
